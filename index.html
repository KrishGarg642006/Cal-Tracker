<style>
  :root {
    --bg:#15120E;
    --surface:#211B15;
    --surface-2:#2A2319;
    --ink:#F2ECE2;
    --ink-muted:#9C9184;
    --line:#392F24;
    --accent:#3D63DD;
    --danger:#D9483A;
    --plate-25:#D9362B;
    --plate-20:#3D63DD;
    --plate-15:#E0B93D;
    --plate-10:#3F9451;
    --plate-5:#D8D2C6;
    --radius:14px;
  }
  * { box-sizing:border-box; }
  html,body { margin:0; padding:0; }
  body {
    background:var(--bg);
    color:var(--ink);
    font-family:'IBM Plex Sans', sans-serif;
    -webkit-font-smoothing:antialiased;
  }

  .toast {
    position:fixed; top:14px; left:50%; transform:translateX(-50%) translateY(-16px);
    background:var(--danger); color:#fff; padding:10px 18px; border-radius:10px;
    font-size:13px; font-family:'IBM Plex Sans',sans-serif; font-weight:600;
    opacity:0; pointer-events:none; transition:opacity .25s ease, transform .25s ease;
    z-index:100; max-width:90%; text-align:center; box-shadow:0 6px 16px rgba(0,0,0,.35);
  }
  .toast.show { opacity:1; transform:translateX(-50%) translateY(0); }

  .app { max-width:480px; margin:0 auto; min-height:100vh; display:flex; flex-direction:column; }

  .app-header { padding:22px 20px 6px; display:flex; align-items:baseline; justify-content:space-between; }
  .brand-lockup { display:flex; align-items:center; gap:9px; }
  .brand-icon { width:30px; height:30px; flex-shrink:0; align-self:center; }
  .brand { font-family:'Big Shoulders Display', sans-serif; font-weight:800; font-size:28px; letter-spacing:.04em; }
  .brand-accent { color:var(--accent); }
  .header-date { font-family:'IBM Plex Mono', monospace; font-size:11px; color:var(--ink-muted); text-transform:uppercase; letter-spacing:.06em; }

  .app-main { flex:1; padding:4px 16px 104px; overflow-y:auto; }

  .panel-title { font-family:'Big Shoulders Display', sans-serif; font-weight:700; font-size:22px; letter-spacing:.03em; margin:18px 0 2px; text-transform:uppercase; }
  .panel-sub { font-size:11px; color:var(--ink-muted); margin-bottom:16px; font-family:'IBM Plex Mono', monospace; text-transform:uppercase; letter-spacing:.05em; }

  .card { background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:16px; margin-bottom:14px; }

  .stat-row { display:flex; justify-content:space-between; align-items:flex-end; margin-bottom:6px; gap:10px; }
  .stat-value { font-family:'IBM Plex Mono', monospace; font-size:30px; font-weight:600; }
  .stat-label { font-size:11px; color:var(--ink-muted); text-transform:uppercase; letter-spacing:.05em; }
  .stat-delta { font-family:'IBM Plex Mono', monospace; font-size:13px; color:var(--ink-muted); }
  .stat-delta.pos { color:var(--accent); }
  .stat-delta.neg { color:var(--danger); }

  .chart-wrap { margin-top:8px; }
  .chart-empty, .empty-state { color:var(--ink-muted); font-size:13px; padding:26px 0; text-align:center; }

  .form-row { display:flex; gap:8px; margin-top:4px; }
  input[type=number], input[type=text] {
    background:var(--surface-2); border:1px solid var(--line); color:var(--ink);
    border-radius:10px; padding:11px 12px; font-family:'IBM Plex Mono', monospace; font-size:15px; width:100%;
  }
  input::placeholder { color:var(--ink-muted); font-family:'IBM Plex Sans', sans-serif; }
  input[type=number]::-webkit-inner-spin-button, input[type=number]::-webkit-outer-spin-button { -webkit-appearance:none; margin:0; }
  input[type=number] { -moz-appearance:textfield; }
  input:focus-visible, button:focus-visible, .tick:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }

  .btn { font-family:'IBM Plex Sans', sans-serif; font-weight:600; font-size:14px; border:none; border-radius:10px; padding:11px 16px; cursor:pointer; white-space:nowrap; }
  .btn-primary { background:var(--accent); color:#fff; }
  .btn-text { background:none; border:none; color:var(--accent); font-size:13px; font-weight:600; cursor:pointer; padding:4px; }

  .list { list-style:none; margin:0; padding:0; }
  .list-row { display:flex; justify-content:space-between; align-items:center; padding:10px 0; border-bottom:1px solid var(--line); font-size:14px; gap:10px; }
  .list-row:last-child { border-bottom:none; }
  .row-date { color:var(--ink-muted); font-size:11px; font-family:'IBM Plex Mono',monospace; text-transform:uppercase; }
  .row-value { font-family:'IBM Plex Mono', monospace; font-weight:600; }
  .remove-btn { background:none; border:none; color:var(--ink-muted); font-size:18px; line-height:1; cursor:pointer; padding:4px 6px; }
  .remove-btn:hover { color:var(--danger); }

  .progress-track { height:10px; background:var(--surface-2); border-radius:6px; overflow:hidden; margin:10px 0 8px; }
  .progress-fill { height:100%; background:var(--accent); border-radius:6px; }
  .progress-fill.over { background:var(--danger); }

  .history-title { font-size:11px; text-transform:uppercase; letter-spacing:.06em; color:var(--ink-muted); margin:18px 0 6px; font-family:'IBM Plex Mono',monospace; }

  .week-bars { display:flex; justify-content:space-between; align-items:flex-end; gap:10px; }
  .week-bar-col { flex:1; display:flex; flex-direction:column; align-items:center; gap:6px; min-width:0; }
  .week-bar-value { font-family:'IBM Plex Mono', monospace; font-size:10px; color:var(--ink-muted); white-space:nowrap; }
  .week-bar-track { width:100%; max-width:34px; height:80px; background:var(--surface-2); border-radius:6px; display:flex; align-items:flex-end; overflow:hidden; }
  .week-bar-fill { width:100%; background:var(--accent); border-radius:6px 6px 0 0; min-height:4px; }
  .week-bar-fill.empty { background:var(--line); }
  .week-bar-label { font-family:'IBM Plex Mono', monospace; font-size:9px; color:var(--ink-muted); text-align:center; line-height:1.3; }

  .day-selector { position:relative; display:flex; align-items:center; justify-content:space-between; padding:20px 6px 10px; }
  .day-selector::before { content:''; position:absolute; left:6px; right:6px; top:calc(50% - 6px); height:4px; background:var(--line); border-radius:2px; z-index:0; }
  .plate { position:relative; z-index:1; border-radius:50%; border:3px solid var(--bg); display:flex; align-items:center; justify-content:center; font-family:'IBM Plex Mono', monospace; font-weight:700; font-size:12px; cursor:pointer; }
  .plate-25 { width:58px; height:58px; background:var(--plate-25); color:#fff; }
  .plate-20 { width:52px; height:52px; background:var(--plate-20); color:#fff; }
  .plate-15 { width:46px; height:46px; background:var(--plate-15); color:#241D10; }
  .plate-10 { width:40px; height:40px; background:var(--plate-10); color:#fff; }
  .plate-5  { width:34px; height:34px; background:var(--plate-5);  color:#241D10; }
  .plate.selected { border-color:var(--ink); transform:translateY(-4px); }

  .day-name { text-align:center; font-family:'Big Shoulders Display', sans-serif; font-size:20px; font-weight:700; text-transform:uppercase; letter-spacing:.04em; margin:8px 0 16px; min-height:26px; }

  .exercise-row { display:flex; align-items:center; gap:12px; padding:12px 0; border-bottom:1px solid var(--line); }
  .exercise-row:last-child { border-bottom:none; }
  .tick { appearance:none; -webkit-appearance:none; width:26px; height:26px; min-width:26px; border:2px solid var(--line); border-radius:7px; background:var(--surface-2); position:relative; cursor:pointer; }
  .tick:checked { background:var(--accent); border-color:var(--accent); }
  .tick:checked::after { content:''; position:absolute; left:8px; top:3px; width:6px; height:12px; border:solid var(--bg); border-width:0 3px 3px 0; transform:rotate(45deg); }
  .ex-main { flex:1; display:flex; flex-direction:column; }
  .ex-name { font-size:14px; font-weight:500; }
  .ex-sets { font-family:'IBM Plex Mono', monospace; font-size:12px; color:var(--ink-muted); }
  .exercise-row.done .ex-name { text-decoration:line-through; color:var(--ink-muted); }

  .edit-ex-row { display:flex; align-items:center; gap:8px; padding:10px 0; border-bottom:1px solid var(--line); }
  .edit-ex-row:last-child { border-bottom:none; }
  .edit-ex-fields { flex:1; display:flex; flex-direction:column; gap:6px; min-width:0; }
  input.edit-ex-name { font-family:'IBM Plex Sans', sans-serif; font-size:14px; padding:9px 10px; }
  input.edit-ex-sets { font-family:'IBM Plex Mono', monospace; font-size:13px; padding:9px 10px; }

  .tab-bar { position:fixed; left:0; right:0; bottom:0; max-width:480px; margin:0 auto; background:var(--surface); border-top:1px solid var(--line); display:flex; }
  .tab-btn { flex:1; background:none; border:none; color:var(--ink-muted); display:flex; flex-direction:column; align-items:center; gap:4px; padding:12px 0 10px; font-family:'IBM Plex Sans',sans-serif; font-size:11px; font-weight:600; letter-spacing:.03em; text-transform:uppercase; cursor:pointer; }
  .tab-btn.active { color:var(--accent); }
  .tab-btn svg { width:20px; height:20px; }

  @media (prefers-reduced-motion: reduce) {
    * { transition:none !important; animation:none !important; }
  }
</style>
</head>
<body>
<div class="app">

  <header class="app-header">

        <circle cx="50" cy="50" r="44" fill="#15120E" stroke="#3D63DD" stroke-width="4"/>

        <circle cx="50" cy="11" r="4.2" fill="#D9362B"/>
        <circle cx="87" cy="38" r="3.8" fill="#3D63DD"/>
        <circle cx="73" cy="82" r="3.4" fill="#E0B93D"/>
        <circle cx="27" cy="82" r="3.0" fill="#3F9451"/>

  </header>

  <main class="app-main">
    <section class="panel" id="panel-weight">
      <div class="panel-title">Weight</div>
      <div class="panel-sub">Body composition log</div>

      <div class="card">
        <div class="stat-row">
          <div>
            <div class="stat-label">Current</div>
            <div class="stat-value" id="w-current">—</div>
          </div>
          <div class="stat-delta" id="w-delta"></div>
        </div>
        <div class="chart-wrap" id="w-chart"></div>
      </div>

      <div class="history-title">Last 4 weeks</div>
      <div class="card" id="w-weeks"></div>

      <div class="card">
        <div class="stat-label" style="margin-bottom:8px;">Log today's weight (kg)</div>
        <div class="form-row">
          <input type="number" id="w-input" step="0.1" min="20" max="300" placeholder="81.0" inputmode="decimal">
          <button class="btn btn-primary" id="w-add">Log</button>
        </div>
      </div>

      <div class="history-title">History</div>
      <ul class="list" id="w-list"></ul>
    </section>

    <section class="panel" id="panel-calories" hidden>
      <div class="panel-title">Calories</div>
      <div class="panel-sub">Daily tracker</div>

      <div class="card" id="c-goal-card"></div>

      <div class="history-title">Last 4 weeks</div>
      <div class="card" id="c-weeks"></div>

      <div class="card">
        <div class="stat-label" style="margin-bottom:8px;">Add food</div>
        <div class="form-row">
          <input type="text" id="c-label" placeholder="What did you eat" maxlength="40">
        </div>
        <div class="form-row" style="margin-top:8px;">
          <input type="number" id="c-kcal" placeholder="kcal" min="1" step="1" inputmode="numeric">
          <button class="btn btn-primary" id="c-add">Add</button>
        </div>
      </div>

      <div class="history-title">Today</div>
      <ul class="list" id="c-list"></ul>

      <div class="history-title">Recent days</div>
      <ul class="list" id="c-history"></ul>
    </section>

    <section class="panel" id="panel-workout" hidden>
      <div class="panel-title">Workout</div>
      <div class="panel-sub">Pick today's session</div>

      <div class="day-selector" id="day-selector"></div>
      <div class="day-name" id="day-name"></div>

      <div class="card" id="workout-card"></div>
    </section>
  </main>

  <nav class="tab-bar" id="tab-bar">
    <button class="tab-btn active" data-tab="weight">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="3.2"/></svg>
      Weight
    </button>
    <button class="tab-btn" data-tab="calories">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2c1 3-3 4-3 8a3 3 0 006 0c0-1.2-.6-2-1-2.6.8.2 2.5 1.4 2.5 4.1A5.5 5.5 0 0111 17a5.5 5.5 0 01-4-9.3C8.5 6 10 4.5 12 2z"/></svg>
      Calories
    </button>
    <button class="tab-btn" data-tab="workout">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="4" y1="12" x2="20" y2="12"/><rect x="2" y="9" width="3" height="6" rx="1" fill="currentColor" stroke="none"/><rect x="19" y="9" width="3" height="6" rx="1" fill="currentColor" stroke="none"/><rect x="5.5" y="7" width="2.5" height="10" rx="1" fill="currentColor" stroke="none"/><rect x="16" y="7" width="2.5" height="10" rx="1" fill="currentColor" stroke="none"/></svg>
      Workout
    </button>
  </nav>
</div>

<script>
'use strict';

var DEFAULT_WORKOUT_DAYS = [

  ]}
];
var PLATE_CLASSES = { d1:'plate-25', d2:'plate-20', d3:'plate-15', d4:'plate-10', d5:'plate-5' };

var weightEntries = [];
var calorieGoal = null;
var calorieEntries = [];
var workoutLog = {};
var workoutProgram = [];
var editingGoal = false;
var editingWorkout = false;
var workoutSaveTimer = null;

function dateToStr(d) {
  var yyyy = d.getFullYear();
  var mm = String(d.getMonth() + 1).padStart(2, '0');
  var dd = String(d.getDate()).padStart(2, '0');
  return yyyy + '-' + mm + '-' + dd;
}
function todayStr() {
  return dateToStr(new Date());
}
function getWeekRanges() {
  var today = new Date();
  today.setHours(0, 0, 0, 0);
  var ranges = [];
  for (var w = 3; w >= 0; w--) {
    var end = new Date(today);
    end.setDate(today.getDate() - (w * 7));
    var start = new Date(end);
    start.setDate(end.getDate() - 6);
    ranges.push({ start: dateToStr(start), end: dateToStr(end) });
  }
  return ranges;
}
function renderWeekBars(weeks, unit, decimals) {
  var vals = weeks.map(function(wk){ return wk.avg; }).filter(function(v){ return v != null; });
  if (!vals.length) {
    return '<div class="chart-empty">Not enough data yet — keep logging to fill this in</div>';
  }
  var max = Math.max.apply(null, vals);
  var min = Math.min.apply(null, vals);
  var range = (max - min) || 1;
  var cols = weeks.map(function(wk) {
    var hasData = wk.avg != null;
    var pct = hasData ? (15 + 80 * ((wk.avg - min) / range)) : 4;
    var valueLabel = hasData ? wk.avg.toFixed(decimals) + unit : '—';
    var label = fmtDate(wk.start) + '–' + fmtDate(wk.end);
    return '<div class="week-bar-col">' +
      '<span class="week-bar-value">' + valueLabel + '</span>' +
      '<div class="week-bar-track"><div class="week-bar-fill' + (hasData ? '' : ' empty') + '" style="height:' + pct.toFixed(0) + '%"></div></div>' +
      '<span class="week-bar-label">' + label + '</span>' +
      '</div>';
  }).join('');
  return '<div class="week-bars">' + cols + '</div>';
}
function fmtDate(str) {
  var parts = str.split('-').map(Number);
  var dt = new Date(parts[0], parts[1] - 1, parts[2]);
  return dt.toLocaleDateString('en-US', { month:'short', day:'numeric' });
}
function uid() {
  return Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
}
function escapeHTML(str) {
  var div = document.createElement('div');
  div.textContent = str == null ? '' : String(str);
  return div.innerHTML;
}

var toastTimer = null;
function showToast(msg) {
  var el = document.getElementById('toast');
  if (!el) return;
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ el.classList.remove('show'); }, 3500);
}

async function loadJSON(key, fallback) {
  try {
    var raw = localStorage.getItem(key);
    return raw != null ? JSON.parse(raw) : fallback;
  } catch (e) {
    return fallback;
  }
}
async function saveJSON(key, value) {
  try {
    localStorage.setItem(key, JSON.stringify(value));
  } catch (e) {
    console.error('Storage save failed for', key, e);
    showToast("Couldn't save — your browser storage may be full or restricted (e.g. Private Browsing).");
  }
}

async function init() {
  try {
    document.getElementById('header-date').textContent =
      new Date().toLocaleDateString('en-US', { weekday:'short', month:'short', day:'numeric' });
  } catch (e) { console.error('Header init failed', e); }

  var results;
  try {
    results = await Promise.all([
      loadJSON('weight-entries', []),
      loadJSON('calorie-goal', null),
      loadJSON('calorie-entries', []),
      loadJSON('workout-log', {}),
      loadJSON('workout-program', null)
    ]);
  } catch (e) {
    console.error('Loading saved data failed', e);
    results = [[], null, [], {}, null];
  }
  weightEntries = results[0] || [];
  calorieGoal = results[1];
  calorieEntries = results[2] || [];
  workoutLog = results[3] || {};
  workoutProgram = results[4] || JSON.parse(JSON.stringify(DEFAULT_WORKOUT_DAYS));

  try { renderWeight(); } catch (e) { console.error('renderWeight failed', e); }
  try { renderCalories(); } catch (e) { console.error('renderCalories failed', e); }
  try { renderWorkout(); } catch (e) { console.error('renderWorkout failed', e); }
  try { bindEvents(); } catch (e) { console.error('bindEvents failed', e); }
}

/* ---------- WEIGHT ---------- */
function renderWeight() {
  var sorted = weightEntries.slice().sort(function(a,b){ return a.date.localeCompare(b.date); });
  var current = sorted[sorted.length - 1];
  document.getElementById('w-current').textContent = current ? current.weight.toFixed(1) + ' kg' : '—';

  var deltaEl = document.getElementById('w-delta');
  if (sorted.length > 1) {
    var delta = sorted[sorted.length - 1].weight - sorted[0].weight;
    var sign = delta > 0 ? '+' : '';
    deltaEl.textContent = sign + delta.toFixed(1) + ' kg since first log';
  } else {
    deltaEl.textContent = '';
  }

  document.getElementById('w-chart').innerHTML = renderChart(sorted);

  var weeks = getWeekRanges().map(function(r) {
    var wEntries = weightEntries.filter(function(e){ return e.date >= r.start && e.date <= r.end; });
    var avg = wEntries.length ? wEntries.reduce(function(s,e){ return s + e.weight; }, 0) / wEntries.length : null;
    return { start: r.start, end: r.end, avg: avg };
  });
  var weeksHtml = renderWeekBars(weeks, ' kg', 1);
  var weeksWithData = weeks.filter(function(wk){ return wk.avg != null; });
  if (weeksWithData.length > 1) {
    var wDelta = weeksWithData[weeksWithData.length - 1].avg - weeksWithData[0].avg;
    var wSign = wDelta > 0 ? '+' : '';
    weeksHtml += '<div class="stat-delta" style="margin-top:12px;text-align:center;">' + wSign + wDelta.toFixed(1) + ' kg across this span</div>';
  }
  document.getElementById('w-weeks').innerHTML = weeksHtml;

  var list = document.getElementById('w-list');
  if (!weightEntries.length) {
    list.innerHTML = '<div class="empty-state">No entries yet — log today\'s weight to start your trend.</div>';
  } else {
    var desc = weightEntries.slice().sort(function(a,b){ return b.date.localeCompare(a.date); });
    list.innerHTML = desc.map(function(e) {
      return '<li class="list-row">' +
        '<span class="row-date">' + fmtDate(e.date) + '</span>' +
        '<div style="display:flex;align-items:center;gap:6px;">' +
        '<span class="row-value">' + e.weight.toFixed(1) + ' kg</span>' +
        '<button class="remove-btn" data-del-weight="' + e.id + '" aria-label="Delete entry">×</button>' +
        '</div></li>';
    }).join('');
  }
}

function renderChart(sorted) {
  if (sorted.length < 2) {
    return '<div class="chart-empty">Log a few entries to see your trend</div>';
  }
  var w = 300, h = 90, pad = 10;
  var weights = sorted.map(function(e){ return e.weight; });
  var min = Math.min.apply(null, weights) - 0.5;
  var max = Math.max.apply(null, weights) + 0.5;
  var range = (max - min) || 1;
  var stepX = (w - pad * 2) / (sorted.length - 1);
  var pts = sorted.map(function(e, i) {
    var x = pad + i * stepX;
    var y = pad + (h - pad * 2) * (1 - (e.weight - min) / range);
    return [x, y];
  });
  var line = pts.map(function(p){ return p[0].toFixed(1) + ',' + p[1].toFixed(1); }).join(' ');
  var dots = pts.map(function(p) {
    return '<circle cx="' + p[0].toFixed(1) + '" cy="' + p[1].toFixed(1) + '" r="3" fill="var(--accent)" />';
  }).join('');
  return '<svg viewBox="0 0 ' + w + ' ' + h + '" width="100%" height="' + h + '" preserveAspectRatio="none">' +
    '<polyline points="' + line + '" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>' +
    dots + '</svg>';
}

async function addWeightEntry() {
  var input = document.getElementById('w-input');
  var val = parseFloat(input.value);
  if (!val || val <= 0) return;
  var today = todayStr();
  var idx = weightEntries.findIndex(function(e){ return e.date === today; });
  if (idx >= 0) weightEntries[idx].weight = val;
  else weightEntries.push({ id: uid(), date: today, weight: val });
  input.value = '';
  await saveJSON('weight-entries', weightEntries);
  renderWeight();
}
async function deleteWeightEntry(id) {
  weightEntries = weightEntries.filter(function(e){ return e.id !== id; });
  await saveJSON('weight-entries', weightEntries);
  renderWeight();
}

/* ---------- CALORIES ---------- */
function renderCalories() {
  var goalCard = document.getElementById('c-goal-card');
  var today = todayStr();
  var todays = calorieEntries.filter(function(e){ return e.date === today; });
  var total = todays.reduce(function(s,e){ return s + e.calories; }, 0);

  if (calorieGoal == null || editingGoal) {
    goalCard.innerHTML =
      '<div class="stat-label" style="margin-bottom:8px;">' + (calorieGoal == null ? 'Set your daily calorie goal' : 'Update your daily calorie goal') + '</div>' +
      '<div class="form-row">' +
      '<input type="number" id="goal-input" placeholder="2400" min="800" max="6000" step="10" inputmode="numeric" value="' + (calorieGoal != null ? calorieGoal : '') + '">' +
      '<button class="btn btn-primary" id="goal-save">Save</button>' +
      '</div>';
  } else {
    var pct = Math.min(100, Math.round((total / calorieGoal) * 100));
    var remaining = calorieGoal - total;
    goalCard.innerHTML =
      '<div class="stat-row">' +
      '<div><div class="stat-label">Consumed / goal</div>' +
      '<div class="stat-value">' + total + ' <span style="font-size:15px;color:var(--ink-muted);">/ ' + calorieGoal + '</span></div></div>' +
      '<button class="btn-text" id="goal-edit">Edit goal</button>' +
      '</div>' +
      '<div class="progress-track"><div class="progress-fill ' + (remaining < 0 ? 'over' : '') + '" style="width:' + pct + '%"></div></div>' +
      '<div class="stat-delta ' + (remaining < 0 ? 'neg' : 'pos') + '">' + (remaining >= 0 ? remaining + ' kcal left' : Math.abs(remaining) + ' kcal over') + '</div>';
  }

  var weeks = getWeekRanges().map(function(r) {
    var wEntries = calorieEntries.filter(function(e){ return e.date >= r.start && e.date <= r.end; });
    if (!wEntries.length) return { start: r.start, end: r.end, avg: null };
    var byDate = {};
    wEntries.forEach(function(e){ byDate[e.date] = (byDate[e.date] || 0) + e.calories; });
    var days = Object.keys(byDate);
    var total = wEntries.reduce(function(s,e){ return s + e.calories; }, 0);
    return { start: r.start, end: r.end, avg: total / days.length };
  });
  document.getElementById('c-weeks').innerHTML = renderWeekBars(weeks, ' kcal', 0);

  var list = document.getElementById('c-list');
  if (!todays.length) {
    list.innerHTML = '<div class="empty-state">Nothing logged yet today.</div>';
  } else {
    list.innerHTML = todays.map(function(e) {
      return '<li class="list-row">' +
        '<span>' + escapeHTML(e.label) + '</span>' +
        '<div style="display:flex;align-items:center;gap:6px;">' +
        '<span class="row-value">' + e.calories + ' kcal</span>' +
        '<button class="remove-btn" data-del-cal="' + e.id + '" aria-label="Delete entry">×</button>' +
        '</div></li>';
    }).join('');
  }

  var byDate = {};
  calorieEntries.forEach(function(e) {
    if (e.date === today) return;
    byDate[e.date] = (byDate[e.date] || 0) + e.calories;
  });
  var days = Object.keys(byDate).sort(function(a,b){ return b.localeCompare(a); }).slice(0, 5);
  var histEl = document.getElementById('c-history');
  if (!days.length) {
    histEl.innerHTML = '<div class="empty-state">No previous days yet.</div>';
  } else {
    histEl.innerHTML = days.map(function(d) {
      return '<li class="list-row"><span class="row-date">' + fmtDate(d) + '</span><span class="row-value">' + byDate[d] + ' kcal</span></li>';
    }).join('');
  }
}

async function saveGoal() {
  var input = document.getElementById('goal-input');
  var val = parseInt(input.value, 10);
  if (!val || val <= 0) return;
  calorieGoal = val;
  editingGoal = false;
  await saveJSON('calorie-goal', calorieGoal);
  renderCalories();
}
async function addCalorieEntry() {
  var labelInput = document.getElementById('c-label');
  var kcalInput = document.getElementById('c-kcal');
  var label = labelInput.value.trim() || 'Food';
  var kcal = parseInt(kcalInput.value, 10);
  if (!kcal || kcal <= 0) return;
  calorieEntries.push({ id: uid(), date: todayStr(), label: label, calories: kcal });
  labelInput.value = '';
  kcalInput.value = '';
  await saveJSON('calorie-entries', calorieEntries);
  renderCalories();
}
async function deleteCalorieEntry(id) {
  calorieEntries = calorieEntries.filter(function(e){ return e.id !== id; });
  await saveJSON('calorie-entries', calorieEntries);
  renderCalories();
}

/* ---------- WORKOUT ---------- */
function getSelectedDay() {
  var today = todayStr();
  var state = workoutLog[today];
  if (!state || !state.day) return null;
  return workoutProgram.filter(function(d){ return d.id === state.day; })[0] || null;
}

function renderWorkout() {
  var today = todayStr();
  var state = workoutLog[today] || { day: null, checked: [] };

  var selector = document.getElementById('day-selector');
  selector.innerHTML = workoutProgram.map(function(d) {
    return '<button class="plate ' + PLATE_CLASSES[d.id] + (state.day === d.id ? ' selected' : '') + '" data-day="' + d.id + '" aria-label="' + escapeHTML(d.label) + ': ' + escapeHTML(d.name) + '">' + d.label.replace('Day ', 'D') + '</button>';
  }).join('');

  var dayNameEl = document.getElementById('day-name');
  var card = document.getElementById('workout-card');

  if (!state.day) {
    dayNameEl.textContent = '';
    card.innerHTML = '<div class="empty-state">Tap a plate above to load today\'s session.</div>';
    return;
  }

  var day = workoutProgram.filter(function(d){ return d.id === state.day; })[0];
  if (!day) { dayNameEl.textContent = ''; card.innerHTML = '<div class="empty-state">Tap a plate above to load today\'s session.</div>'; return; }
  dayNameEl.textContent = day.name;

  if (editingWorkout) {
    card.innerHTML =
      '<div class="stat-row" style="margin-bottom:10px;">' +
      '<span class="stat-label">Editing this day</span>' +
      '<button class="btn-text" id="workout-done-edit">Done</button>' +
      '</div>' +
      '<div class="form-row" style="margin-bottom:14px;">' +
      '<input type="text" id="day-name-input" value="' + escapeHTML(day.name) + '" placeholder="Day name" maxlength="30">' +
      '</div>' +
      day.exercises.map(function(ex) {
        return '<div class="edit-ex-row">' +
          '<div class="edit-ex-fields">' +
          '<input type="text" class="edit-ex-name" data-ex-id="' + ex.id + '" value="' + escapeHTML(ex.name) + '" placeholder="Exercise name" maxlength="60">' +
          '<input type="text" class="edit-ex-sets" data-ex-id="' + ex.id + '" value="' + escapeHTML(ex.sets) + '" placeholder="Sets × reps" maxlength="30">' +
          '</div>' +
          '<button class="remove-btn" data-remove-ex="' + ex.id + '" aria-label="Remove exercise">×</button>' +
          '</div>';
      }).join('') +
      '<button class="btn btn-ghost" id="workout-add-ex" style="width:100%;margin-top:10px;">+ Add exercise</button>' +
      '<div style="text-align:center;margin-top:16px;"><button class="btn-text" id="workout-reset-default">Reset this day to default</button></div>';
    return;
  }

  if (!day.exercises.length) {
    card.innerHTML = '<div class="stat-row" style="margin-bottom:4px;">' +
      '<span></span><button class="btn-text" id="workout-edit">Edit</button></div>' +
      '<div class="empty-state">No exercises yet — tap Edit to add some.</div>';
    return;
  }

  var validIds = day.exercises.map(function(ex){ return ex.id; });
  var doneCount = state.checked.filter(function(id){ return validIds.indexOf(id) >= 0; }).length;
  card.innerHTML =
    '<div class="stat-row" style="margin-bottom:4px;">' +
    '<span class="stat-label">' + doneCount + '/' + day.exercises.length + ' done</span>' +
    '<div style="display:flex;gap:14px;">' +
    '<button class="btn-text" id="workout-edit">Edit</button>' +
    '<button class="btn-text" id="workout-reset">Reset ticks</button>' +
    '</div>' +
    '</div>' +
    day.exercises.map(function(ex) {
      var checked = state.checked.indexOf(ex.id) >= 0;
      return '<div class="exercise-row ' + (checked ? 'done' : '') + '">' +
        '<input type="checkbox" class="tick" data-ex-id="' + ex.id + '" ' + (checked ? 'checked' : '') + ' aria-label="Mark ' + escapeHTML(ex.name) + ' complete">' +
        '<div class="ex-main"><span class="ex-name">' + escapeHTML(ex.name) + '</span><span class="ex-sets">' + escapeHTML(ex.sets) + '</span></div>' +
        '</div>';
    }).join('');
}

function scheduleWorkoutSave() {
  clearTimeout(workoutSaveTimer);
  workoutSaveTimer = setTimeout(function() {
    saveJSON('workout-program', workoutProgram);
  }, 500);
}

async function addExercise() {
  var day = getSelectedDay();
  if (!day) return;
  day.exercises.push({ id: day.id + '-' + uid(), name: '', sets: '' });
  await saveJSON('workout-program', workoutProgram);
  renderWorkout();
}
async function removeExercise(exId) {
  var day = getSelectedDay();
  if (!day) return;
  day.exercises = day.exercises.filter(function(ex){ return ex.id !== exId; });
  await saveJSON('workout-program', workoutProgram);
  renderWorkout();
}
async function resetDayToDefault() {
  var day = getSelectedDay();
  if (!day) return;
  var def = DEFAULT_WORKOUT_DAYS.filter(function(d){ return d.id === day.id; })[0];
  if (!def) return;
  var idx = workoutProgram.findIndex(function(d){ return d.id === day.id; });
  workoutProgram[idx] = JSON.parse(JSON.stringify(def));
  await saveJSON('workout-program', workoutProgram);
  renderWorkout();
}

async function selectWorkoutDay(dayId) {
  var today = todayStr();
  var current = workoutLog[today];
  editingWorkout = false;
  if (current && current.day === dayId) return;
  workoutLog[today] = { day: dayId, checked: [] };
  await saveJSON('workout-log', workoutLog);
  renderWorkout();
}
async function toggleExercise(exId) {
  var today = todayStr();
  var state = workoutLog[today];
  if (!state) return;
  var idx = state.checked.indexOf(exId);
  if (idx >= 0) state.checked.splice(idx, 1);
  else state.checked.push(exId);
  await saveJSON('workout-log', workoutLog);
  renderWorkout();
}
async function resetWorkout() {
  var today = todayStr();
  if (!workoutLog[today]) return;
  workoutLog[today].checked = [];
  await saveJSON('workout-log', workoutLog);
  renderWorkout();
}

/* ---------- TABS ---------- */
function switchTab(tab) {
  document.querySelectorAll('.panel').forEach(function(p) {
    p.hidden = p.id !== ('panel-' + tab);
  });
  document.querySelectorAll('.tab-btn').forEach(function(b) {
    b.classList.toggle('active', b.dataset.tab === tab);
  });
}

/* ---------- EVENTS ---------- */
function bindEvents() {
  document.getElementById('w-add').addEventListener('click', addWeightEntry);
  document.getElementById('w-input').addEventListener('keydown', function(e){ if (e.key === 'Enter') addWeightEntry(); });
  document.getElementById('w-list').addEventListener('click', function(e) {
    var btn = e.target.closest('[data-del-weight]');
    if (btn) deleteWeightEntry(btn.dataset.delWeight);
  });

  document.getElementById('panel-calories').addEventListener('click', function(e) {
    if (e.target.id === 'goal-save') saveGoal();
    if (e.target.id === 'goal-edit') { editingGoal = true; renderCalories(); }
    if (e.target.id === 'c-add') addCalorieEntry();
    var delBtn = e.target.closest('[data-del-cal]');
    if (delBtn) deleteCalorieEntry(delBtn.dataset.delCal);
  });
  document.getElementById('panel-calories').addEventListener('keydown', function(e) {
    if (e.key === 'Enter' && e.target.id === 'goal-input') saveGoal();
    if (e.key === 'Enter' && (e.target.id === 'c-kcal' || e.target.id === 'c-label')) addCalorieEntry();
  });

  document.getElementById('day-selector').addEventListener('click', function(e) {
    var btn = e.target.closest('[data-day]');
    if (btn) selectWorkoutDay(btn.dataset.day);
  });
  document.getElementById('workout-card').addEventListener('click', function(e) {
    if (e.target.id === 'workout-reset') resetWorkout();
    if (e.target.id === 'workout-edit') { editingWorkout = true; renderWorkout(); }
    if (e.target.id === 'workout-done-edit') { editingWorkout = false; clearTimeout(workoutSaveTimer); saveJSON('workout-program', workoutProgram); renderWorkout(); }
    if (e.target.id === 'workout-add-ex') addExercise();
    if (e.target.id === 'workout-reset-default') resetDayToDefault();
    var rmBtn = e.target.closest('[data-remove-ex]');
    if (rmBtn) removeExercise(rmBtn.dataset.removeEx);
  });
  document.getElementById('workout-card').addEventListener('change', function(e) {
    if (e.target.classList.contains('tick')) toggleExercise(e.target.dataset.exId);
  });
  document.getElementById('workout-card').addEventListener('input', function(e) {
    var day = getSelectedDay();
    if (!day) return;
    if (e.target.id === 'day-name-input') {
      day.name = e.target.value;
      document.getElementById('day-name').textContent = day.name;
      scheduleWorkoutSave();
    } else if (e.target.classList.contains('edit-ex-name') || e.target.classList.contains('edit-ex-sets')) {
      var ex = day.exercises.filter(function(x){ return x.id === e.target.dataset.exId; })[0];
      if (!ex) return;
      if (e.target.classList.contains('edit-ex-name')) ex.name = e.target.value;
      else ex.sets = e.target.value;
      scheduleWorkoutSave();
    }
  });

  document.getElementById('tab-bar').addEventListener('click', function(e) {
    var btn = e.target.closest('[data-tab]');
    if (btn) switchTab(btn.dataset.tab);
  });
}

init();
</script>
</body>
</html>
